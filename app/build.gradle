plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.homosep'

    compileSdk 33

    defaultConfig {
        applicationId "com.example.homosep"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lint {
        checkReleaseBuilds true
        warningsAsErrors true
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.0"

    implementation "androidx.appcompat:appcompat:1.6.0"
    implementation "androidx.core:core-ktx:1.10.1"
    
    // Google Play Services - Location/GPS
    implementation "com.google.android.gms:play-services-location:21.0.1"
    
    // Material Design - Bottom Navigation
    implementation "com.google.android.material:material:1.9.0"
    
    // Fragment support
    implementation "androidx.fragment:fragment-ktx:1.6.1"

    // Security crypto for secure shared preferences
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // MQTT client
    implementation "org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5"

    // USB serial drivers for OTG USB-to-TTL adapters
    implementation "com.github.mik3y:usb-serial-for-android:3.10.0"
    
    // Media3 (ExoPlayer) for RTSP streams
    implementation "androidx.media3:media3-exoplayer:1.1.1"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.1.1"
    implementation "androidx.media3:media3-ui:1.1.1"
    
    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
